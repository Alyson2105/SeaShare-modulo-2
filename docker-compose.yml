# Entorno LOCAL del Modulo 2: PostgreSQL.
# RabbitMQ se toma del stack del Modulo 3 (mismo broker compartido, puerto 5672).
# Uso: docker compose up -d | ps | logs -f | down | down -v (borra datos)
# Credenciales solo para desarrollo; deben coincidir con application.yaml

services:

  postgres:                               # Base de datos del Modulo 2
    image: postgres:16-alpine
    container_name: seashare-m2-postgres
    environment:
      POSTGRES_DB: seashare_m2
      POSTGRES_USER: seashare
      POSTGRES_PASSWORD: seashare
    ports:
      - "5434:5432"                       # 5434: M3 usa 5433; evita el choque
    volumes:
      - pgdata:/var/lib/postgresql/data   # Conserva los datos al apagar

volumes:
  pgdata:                                 # Datos de PostgreSQL
